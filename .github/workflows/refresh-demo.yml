# Publishing from GitHub Actions is disabled.
# This workflow does not check out the repo, does not build, and does not push.
# The owner updates the live site from their PC.
name: Refresh public demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Publishing disabled
        run: echo "GitHub Actions does not publish this site."
