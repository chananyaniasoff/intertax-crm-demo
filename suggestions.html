<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הצעות לדמו של מערכת ה-CRM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", sans-serif;
        background: #f4f1ea;
        color: #1c1915;
      }
      body {
        margin: 0;
        background: #f4f1ea;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 18px 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .lead,
      .meta,
      .status {
        color: #6f675d;
      }
      .status.error {
        color: #b42318;
      }
      a {
        color: #1d4e89;
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 16px 0;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: #1d4e89;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 8px 14px;
        cursor: pointer;
      }
      button.delete {
        background: #fff;
        color: #b42318;
        border: 1px solid #e4b4b0;
        padding: 4px 12px;
        font-size: 13px;
      }
      button.delete:hover {
        background: #fdecea;
      }
      button.delete:disabled,
      button.mark:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      button.mark {
        background: #fff;
        color: #1d4e89;
        border: 1px solid #c5d4e6;
        padding: 4px 12px;
        font-size: 13px;
      }
      button.mark:hover {
        background: #eef3f8;
      }
      button.mini,
      button.line,
      button.head {
        background: transparent;
        color: inherit;
        font-weight: 400;
        box-shadow: none;
      }
      button.mini {
        color: #1d4e89;
        padding: 2px 6px;
        font-size: 12px;
        font-weight: 700;
      }
      button.line {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 1 auto;
        max-width: 46%;
        min-width: 0;
        padding: 0;
        border-radius: 8px;
        text-align: right;
        -webkit-user-select: none;
        user-select: none;
      }
      button.head {
        width: 100%;
        padding: 0;
        border-radius: 0;
        text-align: right;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      article {
        background: #fffcf8;
        border: 1px solid #d9d1c5;
        border-radius: 14px;
        padding: 12px 14px;
        min-width: 0;
      }
      article.done {
        background: #f3f1ec;
      }
      article.collapsed {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
      }
      .head {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .num {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: #b42318;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .author {
        font-weight: 700;
      }
      .line .author {
        flex: 0 1 auto;
        max-width: 9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .line .num,
      button.mini,
      article.collapsed button.delete {
        flex: 0 0 auto;
      }
      .excerpt {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        margin: 0;
        color: #6f675d;
        cursor: text;
        -webkit-user-select: text;
        user-select: text;
      }
      time {
        margin-inline-start: auto;
        color: #6f675d;
        font-size: 12px;
      }
      p {
        margin: 0 0 6px;
        white-space: pre-wrap;
        cursor: text;
        -webkit-user-select: text;
        user-select: text;
      }
      p.excerpt {
        margin: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!--
      TEMPORARY review-only inbox. Not part of the CRM.
      KEEP THE URL, PATH, AND WRITE TOKEN IN SYNC with demo-web/src/temp-suggestions/store.ts.
      One save rewrites the shared page once. It counts only after the next
      read still contains it. A confirmed write is not sent again. If the write
      fails or the next read is briefly behind, the note stays in localStorage.
      A later poll may send it once, after a backoff, and only after reading
      the page again. Notes still sitting on the old ntfy topic are merged in.
      ntfy deletes are ignored. A done mark is {"id","done":true}.
      A delete tombstone still wins over done.
    -->
    <main>
      <h1>הצעות לדמו</h1>
      <p class="lead">
        זו רשימת ההצעות המשותפת מהדמו. השכבה זמנית: אפשר לקרוא כאן מה שהשאירו בדף, לסמן
        הצעה כבוצעה, ולמחוק הצעה. אי אפשר לערוך מכאן את המערכת.
      </p>
      <p>
        <a href="./">חזרה לדמו</a>
      </p>
      <div class="toolbar">
        <button type="button" id="refresh">רענון</button>
        <span class="status" id="status">טוען הצעות…</span>
      </div>
      <ol id="list"></ol>
    </main>
    <script>
      const TOPIC_URL = "https://api.telegra.ph/getPage/Intertax-CRM-suggestions-10-15?return_content=true";
      const EDIT_URL = "https://api.telegra.ph/editPage";
      const PAGE_PATH = "Intertax-CRM-suggestions-10-15";
      const PAGE_TOKEN = "26c39a75233526c1497678e28ab69a3a6b498fcc9531f6c5328e5c5d4869";
      const PAGE_TITLE = "Intertax CRM suggestions";
      const NTFY_URL = "https://ntfy.sh/intertax-crm-demo-sug-7f3a9c2e4b81/json?poll=1&since=all";
      const MIRROR_KEY = "itx-sug-mirror-v1";
      const RETRY_MS = 30000;
      const PAUSE_MS = 60000;
      const SETTLE_MS = 8000;
      const CONFIRM_TRIES = 3;

      const list = document.getElementById("list");
      const status = document.getElementById("status");
      const hiddenIds = new Set();
      const pendingDone = new Set();
      const expandedIds = new Set();
      let serverDone = new Set();
      let latest = [];
      let busyId = null;
      let busyKind = "";

      function clip(value) {
        return String(value || "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function formatTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return iso || "";
        return new Intl.DateTimeFormat("he-IL", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function normalize(value) {
        if (!value || typeof value !== "object") return null;
        if (typeof value.id !== "string" || typeof value.text !== "string" || !value.text.trim()) {
          return null;
        }
        const xPct = Number(value.xPct);
        const yPct = Number(value.yPct);
        if (!Number.isFinite(xPct) || !Number.isFinite(yPct)) return null;
        return {
          id: value.id,
          createdAt: typeof value.createdAt === "string" ? value.createdAt : "",
          author: clip(value.author) || "אנונימי",
          text: clip(value.text),
          xPct: xPct,
          yPct: yPct,
          anchor: clip(value.anchor).slice(0, 80),
        };
      }

      function visibleItems(items) {
        return items.filter((item) => !hiddenIds.has(item.id) && !hiddenIds.has(item.id.trim()));
      }

      function isDone(id) {
        return (
          pendingDone.has(id) ||
          pendingDone.has(id.trim()) ||
          serverDone.has(id) ||
          serverDone.has(id.trim())
        );
      }

      function makeDelete(id) {
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = busyId === id && busyKind === "delete" ? "מוחק…" : "מחיקה";
        remove.disabled = busyId !== null;
        remove.addEventListener("click", () => {
          void removeSuggestion(id);
        });
        return remove;
      }

      function render(items) {
        const live = visibleItems(items);
        list.replaceChildren();
        if (live.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "אין עדיין הצעות.";
          list.appendChild(empty);
          return;
        }
        for (let index = 0; index < live.length; index += 1) {
          const item = live[index];
          const done = isDone(item.id);
          const open = !done || expandedIds.has(item.id);
          const card = document.createElement("article");
          const li = document.createElement("li");
          if (done && !open) {
            card.className = "done collapsed";
            const line = document.createElement("button");
            line.type = "button";
            line.className = "line";
            line.setAttribute("aria-expanded", "false");
            line.addEventListener("click", () => {
              expandedIds.add(item.id);
              render(latest);
            });
            const num = document.createElement("span");
            num.className = "num";
            num.textContent = String(index + 1);
            const author = document.createElement("span");
            author.className = "author";
            author.textContent = item.author;
            line.append(num, author);
            const excerpt = document.createElement("p");
            excerpt.className = "excerpt itx-sug-text";
            excerpt.textContent = item.text;
            const expand = document.createElement("button");
            expand.type = "button";
            expand.className = "mini";
            expand.textContent = "הרחבה";
            expand.addEventListener("click", () => {
              expandedIds.add(item.id);
              render(latest);
            });
            card.append(line, excerpt, expand, makeDelete(item.id));
            li.appendChild(card);
            list.appendChild(li);
            continue;
          }
          if (done) card.className = "done";
          const head = document.createElement(done ? "button" : "div");
          head.className = "head";
          if (done) {
            head.type = "button";
            head.setAttribute("aria-expanded", "true");
            head.addEventListener("click", () => {
              expandedIds.delete(item.id);
              render(latest);
            });
          }
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = String(index + 1);
          const author = document.createElement("span");
          author.className = "author";
          author.textContent = item.author;
          const time = document.createElement("time");
          time.dateTime = item.createdAt;
          time.textContent = formatTime(item.createdAt);
          head.append(num, author, time);
          const text = document.createElement("p");
          text.className = "itx-sug-text";
          text.textContent = item.text;
          const meta = document.createElement("p");
          meta.className = "meta";
          const where = item.anchor ? "ליד: " + item.anchor : "בלי טקסט קרוב";
          meta.textContent =
            where +
            " · " +
            Math.round(item.xPct) +
            "% לרוחב, " +
            Math.round(item.yPct) +
            "% לגובה";
          const actions = document.createElement("div");
          actions.className = "actions";
          if (done) {
            const collapse = document.createElement("button");
            collapse.type = "button";
            collapse.className = "mini";
            collapse.textContent = "צמצום";
            collapse.addEventListener("click", () => {
              expandedIds.delete(item.id);
              render(latest);
            });
            actions.appendChild(collapse);
          } else {
            const mark = document.createElement("button");
            mark.type = "button";
            mark.className = "mark";
            mark.textContent = busyId === item.id && busyKind === "done" ? "מסמן…" : "בוצע";
            mark.disabled = busyId !== null;
            mark.addEventListener("click", () => {
              void markDone(item.id);
            });
            actions.appendChild(mark);
          }
          actions.appendChild(makeDelete(item.id));
          card.append(head, text, meta, actions);
          li.appendChild(card);
          list.appendChild(li);
        }
      }

      function showStatus(items) {
        const live = visibleItems(items);
        const noun = live.length === 1 ? "הצעה" : "הצעות";
        status.className = "status";
        status.textContent = "מציג " + live.length + " " + noun + ". הרשימה משותפת עם הדמו.";
      }

      let memory = null;
      let tail = Promise.resolve();

      function messageKey(value) {
        if (!value || typeof value !== "object" || typeof value.id !== "string" || !value.id.trim()) {
          return "";
        }
        if (value.deleted === true) return "del:" + value.id;
        if (typeof value.done === "boolean") return "done:" + value.id;
        if (typeof value.text === "string" && value.text.trim()) return "save:" + value.id;
        return "";
      }

      function snapshotFromMessages(messages) {
        const tombstones = new Set();
        const doneFlags = new Map();
        const byId = new Map();
        for (const payload of messages) {
          if (
            payload &&
            payload.deleted === true &&
            typeof payload.id === "string" &&
            payload.id.trim()
          ) {
            tombstones.add(payload.id);
            tombstones.add(payload.id.trim());
            continue;
          }
          if (
            payload &&
            typeof payload.done === "boolean" &&
            typeof payload.id === "string" &&
            payload.id.trim()
          ) {
            doneFlags.set(payload.id, payload.done);
            doneFlags.set(payload.id.trim(), payload.done);
          }
          const item = normalize(payload);
          if (item) byId.set(item.id, item);
        }
        const live = [...byId.values()].filter(
          (item) => !tombstones.has(item.id) && !tombstones.has(item.id.trim()),
        );
        live.sort((a, b) => a.createdAt.localeCompare(b.createdAt) || a.id.localeCompare(b.id));
        const doneIds = new Set();
        for (const [id, marked] of doneFlags) {
          if (!marked) continue;
          if (tombstones.has(id) || tombstones.has(id.trim())) continue;
          doneIds.add(id);
        }
        return { items: live, doneIds: doneIds };
      }

      function unionMessages(remote, local) {
        const map = new Map();
        for (const message of remote.concat(local)) {
          const key = messageKey(message);
          if (key) map.set(key, message);
        }
        return [...map.values()];
      }

      function hasPending(messages, remote) {
        const remoteKeys = new Set(remote.map(messageKey).filter(Boolean));
        return messages.some((message) => {
          const key = messageKey(message);
          return key && !remoteKeys.has(key);
        });
      }

      function emptyMirror() {
        return { rev: 0, messages: [], pauseUntil: 0, nextWriteAt: 0, dirty: false };
      }

      function sanitizeMirror(value) {
        if (!value || typeof value !== "object" || !Array.isArray(value.messages)) return null;
        return {
          rev: typeof value.rev === "number" ? value.rev : 0,
          messages: value.messages,
          pauseUntil: typeof value.pauseUntil === "number" ? value.pauseUntil : 0,
          nextWriteAt: typeof value.nextWriteAt === "number" ? value.nextWriteAt : 0,
          dirty: value.dirty === true,
        };
      }

      function readStorage() {
        try {
          const raw = localStorage.getItem(MIRROR_KEY);
          if (!raw) return null;
          return sanitizeMirror(JSON.parse(raw));
        } catch (error) {
          return null;
        }
      }

      function loadMirror() {
        const stored = readStorage();
        if (!memory) memory = stored || emptyMirror();
        else if (stored && stored.rev > memory.rev) memory = stored;
        return memory;
      }

      function saveMirror(mirror) {
        mirror.rev += 1;
        memory = mirror;
        try {
          localStorage.setItem(MIRROR_KEY, JSON.stringify(mirror));
        } catch (error) {
          /* A private window still keeps this tab's copy in memory. */
        }
      }

      function rememberMessage(message) {
        const key = messageKey(message);
        if (!key) return false;
        const mirror = loadMirror();
        if (mirror.messages.some((item) => messageKey(item) === key)) return false;
        mirror.messages = mirror.messages.concat([message]);
        mirror.dirty = true;
        saveMirror(mirror);
        return true;
      }

      function applyMirror() {
        const parsed = snapshotFromMessages(loadMirror().messages);
        latest = parsed.items;
        serverDone = parsed.doneIds;
      }

      function collectText(node, out) {
        if (typeof node === "string") {
          out.push(node);
          return;
        }
        if (Array.isArray(node)) {
          for (const child of node) collectText(child, out);
          return;
        }
        if (node && Array.isArray(node.children)) collectText(node.children, out);
      }

      function messagesFromResult(result) {
        if (!result || typeof result !== "object") return null;
        const texts = [];
        collectText(result.content, texts);
        if (texts.length === 0) return [];
        const found = [];
        let parsedAny = false;
        for (const text of texts) {
          try {
            const parsed = JSON.parse(text);
            if (parsed && Array.isArray(parsed.messages)) {
              parsedAny = true;
              found.push.apply(found, parsed.messages);
            }
          } catch (error) {
            /* Keep looking. A title or other node is not the log. */
          }
        }
        return parsedAny ? found : null;
      }

      function timeoutSignal(ms) {
        if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") {
          return AbortSignal.timeout(ms);
        }
        const controller = new AbortController();
        setTimeout(function () {
          controller.abort();
        }, ms);
        return controller.signal;
      }

      async function fetchNtfyMessages() {
        try {
          const response = await fetch(NTFY_URL, { cache: "no-store", signal: timeoutSignal(5000) });
          if (!response.ok) return [];
          const text = await response.text();
          const found = [];
          for (const line of text.split("\n")) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
              const event = JSON.parse(trimmed);
              if (!event || event.event !== "message" || typeof event.message !== "string") continue;
              const payload = JSON.parse(event.message);
              const key = messageKey(payload);
              if (!key || key.indexOf("del:") === 0) continue;
              found.push(payload);
            } catch (error) {
              /* A keepalive or title line is not a note. */
            }
          }
          return found;
        } catch (error) {
          return [];
        }
      }

      function wouldDropRemoteSaves(remote, outgoing) {
        const tombstones = new Set();
        for (const message of outgoing) {
          if (message && message.deleted === true && typeof message.id === "string" && message.id.trim()) {
            tombstones.add(message.id);
            tombstones.add(message.id.trim());
          }
        }
        for (const message of remote) {
          const key = messageKey(message);
          if (!key || key.indexOf("save:") !== 0) continue;
          const id = key.slice(5);
          if (tombstones.has(id) || tombstones.has(id.trim())) continue;
          if (!outgoing.some((item) => messageKey(item) === key)) return true;
        }
        return false;
      }

      async function fetchMessages() {
        try {
          const response = await fetch(TOPIC_URL, { cache: "no-store" });
          if (response.status === 429) return "pause";
          if (!response.ok) return "down";
          const payload = await response.json();
          if (!payload || payload.ok !== true) return "down";
          const messages = messagesFromResult(payload.result);
          return messages === null ? "down" : messages;
        } catch (error) {
          return "down";
        }
      }

      async function writeDocument(messages) {
        if (messages.length === 0) return "later";
        const form = new URLSearchParams();
        form.set("access_token", PAGE_TOKEN);
        form.set("path", PAGE_PATH);
        form.set("title", PAGE_TITLE);
        form.set("content", JSON.stringify([{ tag: "p", children: [JSON.stringify({ messages: messages })] }]));
        form.set("return_content", "true");
        try {
          const response = await fetch(EDIT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: form.toString(),
          });
          const text = await response.text();
          if (response.status === 429) return "pause";
          if (!response.ok) return "later";
          let payload = null;
          try {
            payload = JSON.parse(text);
          } catch (error) {
            return "later";
          }
          if (payload && payload.ok === true) return "ok";
          if (/flood|retry|too many|429/i.test(String((payload && payload.error) || ""))) return "pause";
          return "later";
        } catch (error) {
          return "later";
        }
      }

      function hold(mirror, pause) {
        const delay = pause ? PAUSE_MS : RETRY_MS;
        mirror.dirty = true;
        mirror.nextWriteAt = Date.now() + delay;
        if (pause) mirror.pauseUntil = mirror.nextWriteAt;
        saveMirror(mirror);
      }

      async function flush(force) {
        const mirror = loadMirror();
        if (Date.now() < mirror.pauseUntil) return;
        if (!mirror.dirty) return;
        if (!force && Date.now() < mirror.nextWriteAt) return;
        for (let attempt = 0; attempt < CONFIRM_TRIES; attempt += 1) {
          const remote = await fetchMessages();
          if (remote === "pause") {
            hold(loadMirror(), true);
            return;
          }
          if (remote === "down") {
            hold(loadMirror(), false);
            return;
          }
          const extras = await fetchNtfyMessages();
          const current = loadMirror();
          current.messages = unionMessages(unionMessages(remote, extras), current.messages);
          if (wouldDropRemoteSaves(remote, current.messages)) {
            hold(current, false);
            return;
          }
          if (!hasPending(current.messages, remote)) {
            current.dirty = false;
            saveMirror(current);
            return;
          }
          const sent = current.messages;
          const result = await writeDocument(sent);
          if (result !== "ok") {
            const failed = loadMirror();
            failed.messages = unionMessages(sent, failed.messages);
            hold(failed, result === "pause");
            return;
          }
          const confirmed = await fetchMessages();
          const latestMirror = loadMirror();
          if (confirmed === "pause" || confirmed === "down") {
            latestMirror.messages = unionMessages(sent, latestMirror.messages);
            hold(latestMirror, confirmed === "pause");
            return;
          }
          latestMirror.messages = unionMessages(unionMessages(confirmed, sent), latestMirror.messages);
          if (!hasPending(sent, confirmed)) {
            const stillPending = hasPending(latestMirror.messages, confirmed);
            latestMirror.dirty = stillPending;
            latestMirror.nextWriteAt = Date.now() + (stillPending ? RETRY_MS : SETTLE_MS);
            saveMirror(latestMirror);
            if (!stillPending) return;
            continue;
          }
          latestMirror.dirty = true;
          saveMirror(latestMirror);
        }
        hold(loadMirror(), false);
      }

      function queueFlush(force) {
        const run = tail.then(() => flush(force));
        tail = run.then(
          () => undefined,
          () => undefined,
        );
        return run;
      }

      function absorbExtras(extras) {
        if (!extras.length) return;
        const current = loadMirror();
        const merged = unionMessages(current.messages, extras);
        if (!hasPending(merged, current.messages)) return;
        current.messages = merged;
        current.dirty = true;
        saveMirror(current);
      }

      async function readShared() {
        const mirror = loadMirror();
        const extras = await fetchNtfyMessages();
        if (Date.now() < mirror.pauseUntil) {
          absorbExtras(extras);
          const pausedMirror = loadMirror();
          if (pausedMirror.messages.length > 0) return snapshotFromMessages(pausedMirror.messages);
          throw new Error("read paused");
        }
        const remote = await fetchMessages();
        if (remote === "pause") {
          const paused = loadMirror();
          paused.pauseUntil = Date.now() + PAUSE_MS;
          paused.nextWriteAt = Math.max(paused.nextWriteAt, paused.pauseUntil);
          if (extras.length) {
            const merged = unionMessages(paused.messages, extras);
            if (hasPending(merged, paused.messages)) {
              paused.messages = merged;
              paused.dirty = true;
            }
          }
          saveMirror(paused);
          if (paused.messages.length > 0) return snapshotFromMessages(paused.messages);
          throw new Error("read 429");
        }
        if (remote === "down") {
          absorbExtras(extras);
          const fallback = loadMirror();
          if (fallback.messages.length > 0) return snapshotFromMessages(fallback.messages);
          throw new Error("read failed");
        }
        const current = loadMirror();
        current.messages = unionMessages(unionMessages(remote, extras), current.messages);
        const pending = hasPending(current.messages, remote);
        current.dirty = pending;
        saveMirror(current);
        if (pending && Date.now() >= current.nextWriteAt && Date.now() >= current.pauseUntil) {
          await queueFlush(false);
        }
        return snapshotFromMessages(loadMirror().messages);
      }

      async function load() {
        if (!busyId) {
          status.className = "status";
          status.textContent = "טוען הצעות…";
        }
        try {
          const parsed = await readShared();
          latest = parsed.items;
          serverDone = parsed.doneIds;
          render(latest);
          if (!busyId) showStatus(latest);
        } catch (error) {
          applyMirror();
          render(latest);
          if (!busyId && latest.length === 0) {
            status.className = "status error";
            status.textContent = "לא הצלחנו לטעון את ההצעות. נסו שוב.";
          } else if (!busyId) {
            showStatus(latest);
          }
        }
      }

      async function removeSuggestion(id) {
        if (busyId) return;
        if (!window.confirm("למחוק את ההצעה?")) return;
        busyId = id;
        busyKind = "delete";
        hiddenIds.add(id);
        pendingDone.delete(id);
        pendingDone.delete(id.trim());
        expandedIds.delete(id);
        rememberMessage({ id: id, deleted: true });
        applyMirror();
        render(latest);
        status.className = "status";
        status.textContent = "מוחק…";
        if (Date.now() >= loadMirror().pauseUntil) await queueFlush(true);
        applyMirror();
        busyId = null;
        busyKind = "";
        render(latest);
        showStatus(latest);
      }

      async function markDone(id) {
        if (busyId) return;
        if (serverDone.has(id) || serverDone.has(id.trim())) return;
        busyId = id;
        busyKind = "done";
        pendingDone.add(id);
        expandedIds.delete(id);
        rememberMessage({ id: id, done: true });
        applyMirror();
        render(latest);
        status.className = "status";
        status.textContent = "מסמן…";
        if (Date.now() >= loadMirror().pauseUntil) await queueFlush(true);
        applyMirror();
        busyId = null;
        busyKind = "";
        render(latest);
        showStatus(latest);
      }

      document.getElementById("refresh").addEventListener("click", () => {
        void load();
      });
      void load();
      window.setInterval(() => void load(), 30000);
    </script>
  </body>
</html>
