<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הצעות לדמו של מערכת ה-CRM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", sans-serif;
        background: #f4f1ea;
        color: #1c1915;
      }
      body {
        margin: 0;
        background: #f4f1ea;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 18px 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .lead,
      .meta,
      .status {
        color: #6f675d;
      }
      .status.error {
        color: #b42318;
      }
      a {
        color: #1d4e89;
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 16px 0;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: #1d4e89;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 8px 14px;
        cursor: pointer;
      }
      button.delete {
        background: #fff;
        color: #b42318;
        border: 1px solid #e4b4b0;
        padding: 4px 12px;
        font-size: 13px;
      }
      button.delete:hover {
        background: #fdecea;
      }
      button.delete:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .actions {
        margin-top: 8px;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      article {
        background: #fffcf8;
        border: 1px solid #d9d1c5;
        border-radius: 14px;
        padding: 12px 14px;
      }
      .head {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .num {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: #b42318;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .author {
        font-weight: 700;
      }
      time {
        margin-inline-start: auto;
        color: #6f675d;
        font-size: 12px;
      }
      p {
        margin: 0 0 6px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!--
      TEMPORARY review-only inbox. Not part of the CRM.
      KEEP THE TOPIC URL IN SYNC with demo-web/src/temp-suggestions/store.ts.
    -->
    <main>
      <h1>הצעות לדמו</h1>
      <p class="lead">
        זו רשימת ההצעות המשותפת מהדמו. השכבה זמנית: אפשר לקרוא כאן מה שהשאירו בדף ולמחוק
        הצעה. אי אפשר לערוך מכאן את המערכת.
      </p>
      <p>
        <a href="./">חזרה לדמו</a>
      </p>
      <div class="toolbar">
        <button type="button" id="refresh">רענון</button>
        <span class="status" id="status">טוען הצעות…</span>
      </div>
      <ol id="list"></ol>
    </main>
    <script>
      const TOPIC_URL = "https://ntfy.sh/intertax-crm-demo-sug-7f3a9c2e4b81";

      const list = document.getElementById("list");
      const status = document.getElementById("status");
      const hiddenIds = new Set();
      let latest = [];
      let deleting = false;

      function clip(value) {
        return String(value || "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function formatTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return iso || "";
        return new Intl.DateTimeFormat("he-IL", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function normalize(value) {
        if (!value || typeof value !== "object") return null;
        if (typeof value.id !== "string" || typeof value.text !== "string" || !value.text.trim()) {
          return null;
        }
        const xPct = Number(value.xPct);
        const yPct = Number(value.yPct);
        if (!Number.isFinite(xPct) || !Number.isFinite(yPct)) return null;
        return {
          id: value.id,
          createdAt: typeof value.createdAt === "string" ? value.createdAt : "",
          author: clip(value.author) || "אנונימי",
          text: clip(value.text),
          xPct: xPct,
          yPct: yPct,
          anchor: clip(value.anchor).slice(0, 80),
        };
      }

      function visibleItems(items) {
        return items.filter((item) => !hiddenIds.has(item.id) && !hiddenIds.has(item.id.trim()));
      }

      function render(items) {
        const live = visibleItems(items);
        list.replaceChildren();
        if (live.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "אין עדיין הצעות.";
          list.appendChild(empty);
          return;
        }
        for (let index = 0; index < live.length; index += 1) {
          const item = live[index];
          const card = document.createElement("article");
          const head = document.createElement("div");
          head.className = "head";
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = String(index + 1);
          const author = document.createElement("span");
          author.className = "author";
          author.textContent = item.author;
          const time = document.createElement("time");
          time.dateTime = item.createdAt;
          time.textContent = formatTime(item.createdAt);
          head.append(num, author, time);
          const text = document.createElement("p");
          text.textContent = item.text;
          const meta = document.createElement("p");
          meta.className = "meta";
          const where = item.anchor ? "ליד: " + item.anchor : "בלי טקסט קרוב";
          meta.textContent =
            where +
            " · " +
            Math.round(item.xPct) +
            "% לרוחב, " +
            Math.round(item.yPct) +
            "% לגובה";
          const actions = document.createElement("div");
          actions.className = "actions";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete";
          remove.textContent = deleting ? "מוחק…" : "מחיקה";
          remove.disabled = deleting;
          remove.addEventListener("click", () => {
            void removeSuggestion(item.id);
          });
          actions.appendChild(remove);
          card.append(head, text, meta, actions);
          const li = document.createElement("li");
          li.appendChild(card);
          list.appendChild(li);
        }
      }

      function showStatus(items) {
        const live = visibleItems(items);
        const noun = live.length === 1 ? "הצעה" : "הצעות";
        status.className = "status";
        status.textContent = "מציג " + live.length + " " + noun + ". הרשימה משותפת עם הדמו.";
      }

      function parseTopic(text) {
        const ntfyDeleted = new Set();
        const tombstones = new Set();
        const messages = [];
        for (const line of text.split("\n")) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          let event;
          try {
            event = JSON.parse(trimmed);
          } catch (error) {
            continue;
          }
          if (!event) continue;
          if (event.event === "message_delete" && typeof event.sequence_id === "string") {
            ntfyDeleted.add(event.sequence_id);
            continue;
          }
          if (event.event !== "message" || typeof event.message !== "string") continue;
          messages.push(event);
        }
        const items = [];
        const seen = new Set();
        for (const event of messages) {
          if (ntfyDeleted.has(event.id)) continue;
          let payload;
          try {
            payload = JSON.parse(event.message);
          } catch (error) {
            continue;
          }
          if (
            payload &&
            payload.deleted === true &&
            typeof payload.id === "string" &&
            payload.id.trim()
          ) {
            tombstones.add(payload.id);
            tombstones.add(payload.id.trim());
            continue;
          }
          const item = normalize(payload);
          if (!item || seen.has(item.id)) continue;
          seen.add(item.id);
          items.push(item);
        }
        const live = items.filter((item) => !tombstones.has(item.id) && !tombstones.has(item.id.trim()));
        live.sort((a, b) => a.createdAt.localeCompare(b.createdAt) || a.id.localeCompare(b.id));
        return live;
      }

      function sleep(ms) {
        return new Promise((resolve) => {
          window.setTimeout(resolve, ms);
        });
      }

      async function readTopic() {
        const response = await fetch(TOPIC_URL + "/json?poll=1&since=all", { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));
        return parseTopic(await response.text());
      }

      async function load() {
        if (!deleting) {
          status.className = "status";
          status.textContent = "טוען הצעות…";
        }
        try {
          latest = await readTopic();
          render(latest);
          if (!deleting) showStatus(latest);
        } catch (error) {
          if (!deleting) {
            status.className = "status error";
            status.textContent = "לא הצלחנו לטעון את ההצעות. נסו שוב.";
          }
        }
      }

      async function removeSuggestion(id) {
        if (deleting) return;
        if (!window.confirm("למחוק את ההצעה?")) return;
        deleting = true;
        hiddenIds.add(id);
        render(latest);
        status.className = "status";
        status.textContent = "מוחק…";
        let removed = false;
        let lastError = null;
        try {
          for (let attempt = 0; attempt < 5 && !removed; attempt += 1) {
            try {
              const response = await fetch(TOPIC_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain; charset=UTF-8" },
                body: JSON.stringify({ id: id, deleted: true }),
              });
              if (!response.ok) throw new Error(String(response.status));
              await sleep(1500);
              latest = await readTopic();
              if (!latest.some((item) => item.id === id)) {
                removed = true;
                break;
              }
              lastError = new Error("still present");
            } catch (error) {
              lastError = error;
            }
            await sleep(500 * (attempt + 1));
          }
          if (!removed) throw lastError || new Error("delete failed");
          render(latest);
          showStatus(latest);
        } catch (error) {
          hiddenIds.delete(id);
          render(latest);
          status.className = "status error";
          status.textContent = "לא הצלחנו למחוק את ההצעה. נסו שוב.";
        } finally {
          deleting = false;
          render(latest);
        }
      }

      document.getElementById("refresh").addEventListener("click", () => {
        void load();
      });
      void load();
      window.setInterval(() => void load(), 30000);
    </script>
  </body>
</html>
